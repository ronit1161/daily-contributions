name: Daily Contribution Log

'on':
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "Ronit Tambe"
          git config user.email "125861664+ronit1161@users.noreply.github.com"

      - name: Create daily activity entry
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          mkdir -p activity

          if [ ! -f "activity/$TODAY.md" ]; then
            printf "# Daily Automation Activity\n\nThis repository's scheduled GitHub Actions workflow ran successfully on %s.\n" "$TODAY" > "activity/$TODAY.md"
          fi

          git add "activity/$TODAY.md"

          if git diff --cached --quiet; then
            echo "No new daily entry to commit"
            exit 0
          fi

          git commit -m "chore: record daily automation activity"
          git push
